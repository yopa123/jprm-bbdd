<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>

    <!-- Triangle Glow & Fill -->
    <linearGradient id="triFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Arrow Marker Cyan -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowCyanRev" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M7,1 L1,4 L7,7 Z" fill="#38bdf8" />
    </marker>
  </defs>

  <style>
    .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 19px; fill: #ffffff; letter-spacing: 0.5px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 14.5px; fill: #cbd5e1; }
    .code-pill { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 13px; font-weight: 600; fill: #7dd3fc; }
    .center-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 24px; fill: #ffffff; letter-spacing: 1px; }
    .center-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 14px; fill: #bae6fd; letter-spacing: 0.5px; }
  </style>

  <!-- Background Base -->
  <rect width="1024" height="576" rx="12" fill="url(#bg)" />

  <!-- ==================== CENTRAL TRIANGLE ==================== -->
  <!-- Top: (512, 145), Bottom-Left: (345, 410), Bottom-Right: (679, 410) -->

  <!-- Outer Glow Triangle -->
  <polygon points="512,145 345,410 679,410" fill="url(#triFill)" stroke="#38bdf8" stroke-width="4" filter="url(#neonGlow)" />
  <!-- Crisp Inner Triangle -->
  <polygon points="512,145 345,410 679,410" fill="none" stroke="#e0f2fe" stroke-width="1.5" />

  <!-- Bi-directional Communication Arrows around triangle -->
  <!-- Left Side Arrow -->
  <line x1="330" y1="400" x2="495" y2="135" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrowCyanRev)" marker-end="url(#arrowCyan)" />
  <!-- Right Side Arrow -->
  <line x1="529" y1="135" x2="694" y2="400" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrowCyanRev)" marker-end="url(#arrowCyan)" />
  <!-- Bottom Base Arrow -->
  <line x1="340" y1="432" x2="684" y2="432" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrowCyanRev)" marker-end="url(#arrowCyan)" />

  <!-- Center Text -->
  <g text-anchor="middle">
    <text x="512" y="285" class="center-title">TRIÁNGULO</text>
    <text x="512" y="315" class="center-title">UNIFICADO</text>
    <text x="512" y="352" class="center-sub">Zero-Copy Plan Engine</text>
  </g>

  <!-- ==================== VERTICE 1: TABULAR ANALÍTICO (ARRIBA) ==================== -->
  <g transform="translate(512, 70)">
    <!-- Icon Bar Chart + Grid (Cyan / Esmeralda) -->
    <g transform="translate(-80, -38)">
      <!-- Bars -->
      <rect x="0" y="10" width="7" height="18" rx="1.5" fill="#38bdf8" />
      <rect x="11" y="2" width="7" height="26" rx="1.5" fill="#38bdf8" />
      <rect x="22" y="14" width="7" height="14" rx="1.5" fill="#34d399" />
      <rect x="33" y="0" width="7" height="28" rx="1.5" fill="#34d399" />
      <!-- Grid -->
      <rect x="0" y="34" width="40" height="26" rx="2" fill="none" stroke="#38bdf8" stroke-width="2" />
      <line x1="0" y1="42.5" x2="40" y2="42.5" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="0" y1="51" x2="40" y2="51" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="10" y1="34" x2="10" y2="60" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="20" y1="34" x2="20" y2="60" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="30" y1="34" x2="30" y2="60" stroke="#38bdf8" stroke-width="1.5" />
    </g>
    <!-- Text -->
    <text x="-25" y="-12" class="header-text">[TABLAS Y ANALÍTICA]</text>
    <text x="-25" y="12" class="sub-text">Tablas Relacionales y Agregaciones</text>
    <text x="-25" y="33" class="code-pill">SELECT • GROUP BY • JOIN</text>
  </g>

  <!-- ==================== VERTICE 2: GRAFOS TOPOLÓGICOS (ABAJO IZQUIERDA) ==================== -->
  <g transform="translate(195, 420)">
    <!-- Icon Network / Graph (Azul / Cyan) -->
    <g transform="translate(-40, -10)">
      <line x1="-15" y1="-20" x2="10" y2="-28" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
      <line x1="-15" y1="-20" x2="-25" y2="8" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
      <line x1="-15" y1="-20" x2="0" y2="0" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
      <line x1="10" y1="-28" x2="25" y2="-12" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
      <line x1="10" y1="-28" x2="0" y2="0" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
      <line x1="25" y1="-12" x2="20" y2="15" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
      <line x1="0" y1="0" x2="-25" y2="8" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
      <line x1="0" y1="0" x2="20" y2="15" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
      <line x1="-25" y1="8" x2="-5" y2="28" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
      <line x1="20" y1="15" x2="-5" y2="28" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />

      <circle cx="-15" cy="-20" r="5" fill="#0284c7" />
      <circle cx="10" cy="-28" r="5.5" fill="#38bdf8" />
      <circle cx="25" cy="-12" r="4.5" fill="#0284c7" />
      <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      <circle cx="-25" cy="8" r="5" fill="#0284c7" />
      <circle cx="20" cy="15" r="5" fill="#38bdf8" />
      <circle cx="-5" cy="28" r="5.5" fill="#0284c7" />
    </g>
    <!-- Text -->
    <g text-anchor="middle" transform="translate(0, 52)">
      <text x="0" y="0" class="header-text">[REDES Y CONEXIONES]</text>
      <text x="0" y="24" class="sub-text">Caminos, Jerarquías y Relaciones</text>
      <text x="0" y="45" class="code-pill">GRAPH_PATH(nodo, profundidad)</text>
    </g>
  </g>

  <!-- ==================== VERTICE 3: DOCUMENTAL SCHEMALESS (ABAJO DERECHA) ==================== -->
  <g transform="translate(805, 420)">
    <!-- Icon Dual Document / JSON (Naranja cálido) -->
    <g transform="translate(-25, -25)">
      <!-- Back Doc -->
      <path d="M12,0 L32,0 L42,10 L42,42 L12,42 Z" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" />
      <!-- Front Doc -->
      <path d="M0,8 L20,8 L30,18 L30,50 L0,50 Z" fill="#07090e" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M20,8 L20,18 L30,18" fill="none" stroke="#fbbf24" stroke-width="2.5" />
      <!-- JSON curly braces { ... } -->
      <text x="15" y="36" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">{···}</text>
    </g>
    <!-- Text -->
    <g text-anchor="middle" transform="translate(0, 52)">
      <text x="0" y="0" class="header-text">[DOCUMENTOS JSON]</text>
      <text x="0" y="24" class="sub-text">Colecciones Flexibles Schemaless</text>
      <text x="0" y="45" class="code-pill">COLLECTION() • json_extract()</text>
    </g>
  </g>
</svg>
